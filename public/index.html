<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME STORM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1 class="logo">ANIME <span>STORM</span></h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Anime ara..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>
    </header>

    <main class="container">
        <h2>Önerilen Animeler</h2>
        <div class="anime-grid" id="animeGrid"></div>
    </main>

    <!-- Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle"></h2>
            <img id="modalImage" src="" style="width:100%; max-height:250px; object-fit:cover; border-radius:8px; margin:10px 0;">
            <p id="modalDescription" style="font-size:13px; color:#ccc;"></p>
            
            <div id="playerSection" style="display:none; margin-top:15px;">
                <h3 id="currentEpisodeTitle" style="font-size:14px; color:#00a8ff;"></h3>
                <div id="sourcesContainer" style="display:flex; gap:5px; margin:10px 0;"></div>
                <div class="iframe-container" style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden;">
                    <iframe id="videoPlayer" src="" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
                </div>
            </div>

            <div style="margin-top:15px;">
                <h4>Bölümler</h4>
                <div id="episodesGrid" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;"></div>
            </div>

            <div id="fansubSection" style="margin-top:15px; font-size:12px; color:#aaa; border-top:1px solid #333; padding-top:8px;">
                Çeviri & Emek: <a id="fansubLink" href="#" target="_blank" style="color:#00a8ff;"></a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
