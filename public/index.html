<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME STORM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1 class="logo">ANIME <span>STORM</span></h1>
        
        <div class="nav-right">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Anime ara...">
                <div id="searchResults" class="search-results"></div>
            </div>
            
            <!-- Profil Butonu -->
            <button id="openProfileBtn" class="profile-btn">
                <img id="navAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=W" alt="Profil">
                <span id="navUsername">Profil</span>
            </button>
        </div>
    </header>

    <main class="container">
        <h2>Önerilen Animeler</h2>
        <div class="anime-grid" id="animeGrid"></div>
    </main>

    <!-- Anime Detay Modalı -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle"></h2>
            <img id="modalImage" src="" style="width:100%; border-radius:8px; margin-top:10px;">
            <p id="modalDescription" style="font-size:14px; color:#ccc; margin-top:10px;"></p>

            <div id="playerSection" style="display:none; margin-top:15px;">
                <h3 id="currentEpisodeTitle" style="font-size:16px;"></h3>
                <div id="sourcesContainer" style="display:flex; gap:10px; margin-top:5px;"></div>
                <div class="iframe-container" style="position:relative; padding-bottom:56.25%; height:0; margin-top:10px;">
                    <iframe id="videoPlayer" src="" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none; border-radius:8px;" allowfullscreen></iframe>
                </div>
            </div>

            <div style="margin-top:15px;">
                <h4>Bölümler</h4>
                <div id="episodesGrid" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
            </div>

            <div id="fansubSection" style="margin-top:15px; font-size:12px; color:#888;">
                Çeviri & Emek: <a id="fansubLink" href="#" target="_blank" style="color:#0088ff;"></a>
            </div>
        </div>
    </div>

    <!-- Profil Ayarları Modalı -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeProfileModal">&times;</span>
            <h2>Profil Ayarları</h2>
            
            <div class="profile-settings">
                <div class="avatar-preview">
                    <img id="profileAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=W" alt="Avatar">
                </div>
                
                <label for="usernameInput">Kullanıcı Adın:</label>
                <input type="text" id="usernameInput" placeholder="Kullanıcı adını yaz..." value="W">

                <label for="avatarFileInput">Profil Resmi Seç (Galeriden / Dosyalardan):</label>
                <input type="file" id="avatarFileInput" accept="image/*">

                <button id="saveProfileBtn" class="save-btn">Profilini Kaydet</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
